        // 5. 游戏更新逻辑
        function update(deltaTime) {
            if (!gameState.isStarted || gameState.isPaused || gameState.canUpgrade) return;

            // 检查无敌帧是否结束
            if (player.isInvincible && Date.now() >= player.invincibleEndTime) {
                player.isInvincible = false;
            }

            updateSkillCooldownUI();

            // 西部猫咪：检查装弹状态
            if (player.hasCowboyPassive && player.isReloading) {
                const now = Date.now();
                if (now >= player.reloadEndTime) {
                    player.isReloading = false;
                }
            }
            
            // 西部猫咪：检查骑乘状态
            if (player.hasCowboySkill && player.ridingEnemy) {
                const now = Date.now();
                if (now >= player.ridingEndTime) {
                    // 骑乘结束，恢复正常速度
                    player.speed = player.baseSpeed * player.speedMultiplier;
                    player.ridingEnemy = null;
                    player.ridingEndTime = 0;
                }
            }
            
            // 优化移动流畅度，使用deltaTime使移动速度与帧率无关
            let moveSpeed = player.speed * (deltaTime / 16); // 基于60fps的基准
            
            // 西部猫咪骑乘时的额外速度加成
            if (player.hasCowboySkill && player.ridingEnemy) {
                moveSpeed += 5 * (deltaTime / 16); // 骑乘时移速+5
            }
            
            if (player.keys.w && player.y > 0) player.y -= moveSpeed;
            if (player.keys.s && player.y < canvas.height - player.height) player.y += moveSpeed;
            if (player.keys.a && player.x > 0) player.x -= moveSpeed;
            if (player.keys.d && player.x < canvas.width - player.width) player.x += moveSpeed;

            // 基于最大生命值的5%每秒回血
            const now = Date.now();
            if (now - player.lastRegenTime >= 1000) {
                const maxHp = player.maxHp + player.maxHpBonus;
                const regenAmount = maxHp * 0.05; // 5%的最大生命值
                player.hp = Math.min(player.hp + regenAmount, maxHp);
                player.lastRegenTime = now;
            }
            
            // 自动射击逻辑 - 向鼠标方向射击
            if (player.autoShoot) {
                const now = Date.now();
                if (now - player.lastShootTime > player.shootRate) {
                    const angle = Math.atan2(mouseY - (player.y + player.height/2), mouseX - (player.x + player.width/2));
                    shootBullet(player.x + player.width/2, player.y + player.height/2, angle);
                    player.lastShootTime = now;
                }
            }

            enemySpawnTimer += deltaTime;
            
            // 波数时间倒计时
            if (gameState.isStarted && !gameState.canUpgrade) {
                const currentTime = Date.now();
                const elapsedSeconds = Math.floor((currentTime - gameState.waveStartTime) / 1000);
                
                // BOSS波数不计时，必须击败BOSS才能结束
                const isBossWave = gameState.bossWaves.includes(gameState.currentWave);
                if (!isBossWave) {
                    gameState.waveTimeRemaining = Math.max(0, 60 - elapsedSeconds);
                } else {
                    // BOSS波数显示剩余敌人数量
                    gameState.waveTimeRemaining = -1; // 表示特殊状态
                }
                
                // 非BOSS波数时间到，自动进入下一波
                if (!isBossWave && gameState.waveTimeRemaining <= 0 && gameState.currentWave < gameState.maxWaves) {
                    gameState.currentWave++;
                    gameState.waveStartTime = Date.now();
                    gameState.waveEnemiesSpawned = 0;
                    gameState.bossDefeated = false;
                    alert(`第${gameState.currentWave}波开始！`);
                }
                
                // BOSS波数：击败BOSS后进入下一波
                if (isBossWave && gameState.bossDefeated && !gameState.bossSpawned && gameState.currentWave < gameState.maxWaves) {
                    gameState.currentWave++;
                    gameState.waveStartTime = Date.now();
                    gameState.waveEnemiesSpawned = 0;
                    gameState.bossDefeated = false;
                    alert(`第${gameState.currentWave}波开始！`);
                }
                
                // 最后一波击败BOSS后游戏胜利
                if (gameState.currentWave >= gameState.maxWaves && gameState.bossDefeated && enemies.length === 0) {
                    alert(`恭喜通关！\n最终分数：${Math.floor(score)}\n消灭敌人：${enemiesKilled}个\n强化等级：${gameState.upgradeLevel}`);
                    gameState.isStarted = false;
                    startScreen.style.display = 'flex';
                }
            }
            
            // 根据波数和难度生成不同类型的敌人
            if (enemySpawnTimer >= enemySpawnInterval) {
                let enemyType = 'normal';
                
                // BOSS出现时不生成奶怪
                const canSpawnHealer = !gameState.bossSpawned && gameState.currentWave >= 2 && Math.random() < 0.1;
                
                // 根据当前波数决定生成的敌人类型
                if (canSpawnHealer) {
                    enemyType = 'healer';
                } else if (gameState.currentWave >= gameState.meatEnemyWave && Math.random() < 0.3) {
                    enemyType = 'meat';
                } else if (gameState.currentWave >= gameState.rushEnemyWave && Math.random() < 0.2) {
                    enemyType = 'rush';
                }
                
                spawnEnemy(enemyType);
                gameState.waveEnemiesSpawned++;
                enemySpawnTimer = 0;
            }
            
            // BOSS生成逻辑：根据波数（第4、7、10波）
            const isBossWave = gameState.bossWaves.includes(gameState.currentWave);
            if (isBossWave && !gameState.bossSpawned && !gameState.bossDefeated) {
                spawnBoss();
            }
            
            // 旧BOSS生成逻辑已由波数系统取代
            // if (gameState.bossKillCount === 0) {
            //     if (enemiesKilled >= 30 && !gameState.bossSpawned) {
            //         spawnBoss();
            //     }
            // } else {
            //     if (gameState.enemiesSinceBossDefeated >= 100 && !gameState.bossSpawned) {
            //         spawnBoss();
            //     }
            // }

            for (let i = bullets.length - 1; i >= 0; i--) {
                const bullet = bullets[i];
                bullet.trail.push({x: bullet.x, y: bullet.y});
                if (bullet.trail.length > 5) bullet.trail.shift();
                
                bullet.x += Math.cos(bullet.angle) * bulletSpeed;
                bullet.y += Math.sin(bullet.angle) * bulletSpeed;
                
                // 修复：分裂触发逻辑
                const isOutOfBounds = bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height;
                if (isOutOfBounds) {
                    if (bullet.splitCount > 0) {
                        splitBullet(bullet.x, bullet.y, bullet.angle, bullet.damage, bullet.splitCount);
                    }
                    bullets.splice(i, 1);
                }
            }
            
            for (let i = bossBullets.length - 1; i >= 0; i--) {
                const bullet = bossBullets[i];
                bullet.trail.push({x: bullet.x, y: bullet.y});
                if (bullet.trail.length > 8) bullet.trail.shift();
                
                bullet.x += Math.cos(bullet.angle) * bossBulletSpeed;
                bullet.y += Math.sin(bullet.angle) * bossBulletSpeed;
                
                if (checkCollision(
                    {x: bullet.x, y: bullet.y, width: bossBulletSize, height: bossBulletSize},
                    {x: player.x, y: player.y, width: player.width, height: player.height}
                )) {
                    bossBullets.splice(i, 1);
                    
                    // 检查玩家是否无敌
                    if (!player.isInvincible) {
                        let damage = Math.max(1, Math.floor(15 - player.defense));
                        player.hp -= damage;
                        ctx.fillStyle = 'rgba(255,0,0,0.5)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // 给玩家0.5秒无敌帧
                        player.isInvincible = true;
                        player.invincibleEndTime = Date.now() + 500;
                        
                        // 仙人掌猫被动：受击时对附近敌人造成1真实伤害
                        triggerCactusPassive();
                        
                        if (player.hp <= 0) {
                            handlePlayerDeath();
                        }
                    }
                    continue;
                }
                
                if (bullet.x < 0 || bullet.x > canvas.width || bullet.y < 0 || bullet.y > canvas.height) {
                    bossBullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                const enemy = enemies[i];
                
                let targetX, targetY;
                if (penguins.length > 0) {
                    const randomPenguin = penguins[Math.floor(Math.random() * penguins.length)];
                    targetX = randomPenguin.x;
                    targetY = randomPenguin.y;
                } else {
                    targetX = player.x;
                    targetY = player.y;
                }
                
                const dx = targetX - enemy.x;
                const dy = targetY - enemy.y;
                const angle = Math.atan2(dy, dx);
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);
                
                // 冲怪特殊行为：周期性冲锋
                if (enemy.type === 'rush') {
                    enemy.rushCooldown += deltaTime;
                    if (enemy.isRushing) {
                        // 冲锋状态，持续1秒，速度加倍
                        enemy.x += cos * enemy.speed * 3;
                        enemy.y += sin * enemy.speed * 3;
                        enemy.rushTimer += deltaTime;
                        if (enemy.rushTimer >= 1000) {
                            enemy.isRushing = false;
                            enemy.rushTimer = 0;
                            enemy.rushCooldown = 0;
                        }
                    } else if (enemy.rushCooldown >= 3000) {
                        // 3秒后开始冲锋
                        enemy.isRushing = true;
                    } else {
                        // 正常移动
                        enemy.x += cos * enemy.speed;
                        enemy.y += sin * enemy.speed;
                    }
                } else if (enemy.type === 'healer') {
                    // 奶怪：给其他怪物回血（不给奶怪和玩家回血）
                    enemy.healCooldown += deltaTime;
                    if (enemy.healCooldown >= 3000) { // 每3秒回血一次
                        // 找到附近的其他敌人并回血
                        enemies.forEach(otherEnemy => {
                            // 不给自己、奶怪回血
                            if (otherEnemy !== enemy && otherEnemy.hp < otherEnemy.maxHp && otherEnemy.type !== 'healer') {
                                const dx = otherEnemy.x - enemy.x;
                                const dy = otherEnemy.y - enemy.y;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance <= 150) { // 150像素范围内
                                    otherEnemy.hp = Math.min(otherEnemy.hp + 10, otherEnemy.maxHp);
                                    // 回血特效
                                    otherEnemy.color = '#00FF00';
                                    setTimeout(() => {
                                        if (otherEnemy) otherEnemy.color = otherEnemy.originalColor;
                                    }, 200);
                                }
                            }
                        });
                        enemy.healCooldown = 0;
                    }
                    // 奶怪移动到玩家位置
                    enemy.x += cos * enemy.speed;
                    enemy.y += sin * enemy.speed;
                } else {
                    enemy.x += cos * enemy.speed;
                    enemy.y += sin * enemy.speed;
                }
                
                // 边界检查：确保敌人不会跑出地图太远
                if (enemy.x < -enemySize * 2 || enemy.x > canvasWidth + enemySize * 2 || 
                    enemy.y < -enemySize * 2 || enemy.y > canvasHeight + enemySize * 2) {
                    enemies.splice(i, 1);
                    continue;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (checkCollision(
                        {x: bullet.x, y: bullet.y, width: bulletSize, height: bulletSize},
                        {x: enemy.x, y: enemy.y, width: enemySize, height: enemySize}
                    )) {
                        // 检查是否需要分裂
                        if (bullet.splitCount > 0) {
                            splitBullet(bullet.x, bullet.y, bullet.angle, bullet.damage, bullet.splitCount);
                        }
                        bullets.splice(j, 1);
                        // 计算伤害，考虑敌人防御
                        const damage = Math.max(1, bullet.damage - enemy.defense);
                        enemy.hp -= damage;
                        
                        enemy.color = '#ff0000';
                        setTimeout(() => {
                            if (enemy) enemy.color = enemy.originalColor;
                        }, 100);

                        if (enemy.hp <= 0) {
                            // 史莱姆分裂逻辑
                            if (enemy.type === 'slime') {
                                switch(enemy.slimeType) {
                                    case 'large':
                                        // 大史莱姆分裂为2个中史莱姆
                                        spawnSlime('medium', enemy.x, enemy.y);
                                        spawnSlime('medium', enemy.x + 20, enemy.y + 20);
                                        break;
                                    case 'medium':
                                        // 中史莱姆分裂为2个小史莱姆
                                        spawnSlime('small', enemy.x, enemy.y);
                                        spawnSlime('small', enemy.x + 15, enemy.y + 15);
                                        break;
                                    // 小史莱姆死亡不分裂
                                }
                            }
                            
                            enemies.splice(i, 1);
                            score += 10 * (1 + gameState.bossKillCount * 0.5);
                            enemiesKilled += 1;
                            
                            // 击败BOSS后计数
                            if (gameState.bossDefeated && !gameState.bossSpawned) {
                                gameState.enemiesSinceBossDefeated++;
                            }
                            
                            checkUpgradeCondition();
                            
                            if (Math.random() < rewardSpawnChance) {
                                spawnReward(enemy.x, enemy.y);
                            }
                            break;
                        }
                    }
                }

                if (checkCollision(
                    {x: player.x, y: player.y, width: player.width, height: player.height},
                    {x: enemy.x, y: enemy.y, width: enemy.slimeSize || enemySize, height: enemy.slimeSize || enemySize}
                )) {
                    // 检查玩家是否无敌
                    if (!player.isInvincible) {
                        // 根据敌人类型计算伤害
                        let baseDamage = 0;
                        if (enemy.type === 'healer') {
                            baseDamage = 0; // 奶怪不造成伤害
                        } else if (enemy.type === 'slime') {
                            baseDamage = enemy.damage || 15; // 史莱姆使用自身攻击力
                        } else {
                            baseDamage = 15; // 其他怪物默认伤害
                        }
                        
                        if (baseDamage > 0) {
                            let damage = Math.max(1, Math.floor(baseDamage - player.defense));
                            player.hp -= damage;
                            ctx.fillStyle = 'rgba(255,0,0,0.3)';
                            ctx.fillRect(0, 0, canvas.width, canvas.height);
                            
                            // 给玩家0.5秒无敌帧
                            player.isInvincible = true;
                            player.invincibleEndTime = Date.now() + 500;
                            
                            // 仙人掌猫被动：受击时对附近敌人造成1真实伤害
                            triggerCactusPassive();
                            
                            if (player.hp <= 0) {
                                handlePlayerDeath();
                            }
                        }
                    }
                    // 小怪碰到玩家后不消失，只是碰撞
                }
                
                for (let p = penguins.length - 1; p >= 0; p--) {
                    const penguin = penguins[p];
                    if (checkCollision(
                        {x: enemy.x, y: enemy.y, width: enemySize, height: enemySize},
                        {x: penguin.x, y: penguin.y, width: penguinSize, height: penguinSize}
                    )) {
                        penguin.hp -= 5;
                        enemies.splice(i, 1);
                        
                        if (penguin.hp <= 0) {
                            penguins.splice(p, 1);
                        }
                        break;
                    }
                }
            }
            
            for (let i = penguins.length - 1; i >= 0; i--) {
                const penguin = penguins[i];
                
                if (enemies.length > 0) {
                    const nearestEnemy = enemies.reduce((nearest, enemy) => {
                        const distNearest = Math.sqrt(Math.pow(nearest.x - penguin.x, 2) + Math.pow(nearest.y - penguin.y, 2));
                        const distEnemy = Math.sqrt(Math.pow(enemy.x - penguin.x, 2) + Math.pow(enemy.y - penguin.y, 2));
                        return distEnemy < distNearest ? enemy : nearest;
                    }, enemies[0]);
                    
                    const dx = nearestEnemy.x - penguin.x;
                    const dy = nearestEnemy.y - penguin.y;
                    const angle = Math.atan2(dy, dx);
                    
                    const distanceSquared = dx * dx + dy * dy;
                    if (distanceSquared > 6400) { // 80^2 = 6400
                        const cos = Math.cos(angle);
                        const sin = Math.sin(angle);
                        penguin.x += cos * penguinSpeed;
                        penguin.y += sin * penguinSpeed;
                        
                        // 边界检查：确保企鹅不会跑出地图
                        penguin.x = Math.max(0, Math.min(penguin.x, canvasWidth - penguinSize));
                        penguin.y = Math.max(0, Math.min(penguin.y, canvasHeight - penguinSize));
                    }
                    
                    const now = Date.now();
                    if (now - penguin.lastShootTime > penguinShootRate) {
                        penguinShoot(penguin);
                        penguin.lastShootTime = now;
                    }
                } else {
                    // 当没有敌人时，也确保企鹅不会跑出地图
                    penguin.x = Math.max(0, Math.min(penguin.x, canvas.width - penguinSize));
                    penguin.y = Math.max(0, Math.min(penguin.y, canvas.height - penguinSize));
                }
                
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (bullet.color === '#cc0000' && checkCollision(
                        {x: bullet.x, y: bullet.y, width: bulletSize, height: bulletSize},
                        {x: penguin.x, y: penguin.y, width: penguinSize, height: penguinSize}
                    )) {
                        bullets.splice(j, 1);
                        penguin.hp -= 3;
                        
                        if (penguin.hp <= 0) {
                            penguins.splice(i, 1);
                            break;
                        }
                    }
                }
            }
            
            if (boss.isAlive) {
                let bossWidth = boss.size || boss.width;
                let bossHeight = boss.size || boss.height;
                
                // 肉冲BOSS冲刺逻辑
                if (boss.type === 'meatRush') {
                    boss.rushCooldown += deltaTime;
                    if (boss.isRushing) {
                        // 冲锋状态，持续1.5秒，速度3倍
                        boss.x += Math.cos(angle) * boss.speed * 3;
                        boss.y += Math.sin(angle) * boss.speed * 3;
                        boss.rushTimer += deltaTime;
                        if (boss.rushTimer >= 1500) {
                            boss.isRushing = false;
                            boss.rushTimer = 0;
                            boss.rushCooldown = 0;
                        }
                    } else if (boss.rushCooldown >= 7000) {
                        // 7秒后开始冲锋
                        boss.isRushing = true;
                    } else {
                        // 正常移动
                        const dx = player.x - boss.x;
                        const dy = player.y - boss.y;
                        const angle = Math.atan2(dy, dx);
                        boss.x += Math.cos(angle) * boss.speed;
                        boss.y += Math.sin(angle) * boss.speed;
                    }
                } else {
                    const dx = player.x - boss.x;
                    const dy = player.y - boss.y;
                    const angle = Math.atan2(dy, dx);
                    boss.x += Math.cos(angle) * boss.speed;
                    boss.y += Math.sin(angle) * boss.speed;
                }
                
                boss.attackTimer += deltaTime;
                if (boss.attackTimer >= boss.attackInterval) {
                    bossShoot();
                    boss.attackTimer = 0;
                }
                
                for (let j = bullets.length - 1; j >= 0; j--) {
                    const bullet = bullets[j];
                    if (checkCollision(
                        {x: bullet.x, y: bullet.y, width: bulletSize, height: bulletSize},
                        {x: boss.x, y: boss.y, width: bossWidth, height: bossHeight}
                    )) {
                        bullets.splice(j, 1);
                        // 考虑BOSS防御
                        const damage = Math.max(1, bullet.damage - (boss.defense || 0));
                        boss.hp -= damage;
                        
                        if (boss.hp <= 0) {
                            // 史莱姆王分裂逻辑
                            if (boss.type === 'slimeKing') {
                                // 分裂为2个大史莱姆
                                spawnSlime('large', boss.x, boss.y);
                                spawnSlime('large', boss.x + bossWidth/2, boss.y + bossHeight/2);
                            }
                            
                            boss.isAlive = false;
                            gameState.bossSpawned = false; // 允许生成下一个BOSS
                            score += 1000;
                            for (let k = 0; k < 10; k++) {
                                checkUpgradeCondition();
                            }
                            
                            spawnBossReward(boss.x + bossWidth/2, boss.y + bossHeight/2);
                            
                            alert(`恭喜击败BOSS！获得1000分奖励！解锁高级强化！`);
                            break;
                        }
                    }
                }
                
                if (checkCollision(
                    {x: player.x, y: player.y, width: player.width, height: player.height},
                    {x: boss.x, y: boss.y, width: bossWidth, height: bossHeight}
                )) {
                    // 检查玩家是否无敌
                    if (!player.isInvincible) {
                        // 根据BOSS类型计算伤害
                        let baseDamage = 25;
                        if (boss.type === 'slimeKing') baseDamage = 30;
                        else if (boss.type === 'meatRush') baseDamage = 20;
                        
                        let damage = Math.max(1, Math.floor(baseDamage - player.defense));
                        player.hp -= damage;
                        ctx.fillStyle = 'rgba(255,0,0,0.8)';
                        ctx.fillRect(0, 0, canvas.width, canvas.height);
                        
                        // 给玩家0.5秒无敌帧
                        player.isInvincible = true;
                        player.invincibleEndTime = Date.now() + 500;
                        
                        // 仙人掌猫被动：受击时对附近敌人造成1真实伤害
                        triggerCactusPassive();
                        
                        if (player.hp <= 0) {
                            handlePlayerDeath();
                        }
                    }
                }
                
                for (let p = penguins.length - 1; p >= 0; p--) {
                    const penguin = penguins[p];
                    if (checkCollision(
                        {x: boss.x, y: boss.y, width: bossWidth, height: bossHeight},
                        {x: penguin.x, y: penguin.y, width: penguinSize, height: penguinSize}
                    )) {
                        penguin.hp -= 10;
                        if (penguin.hp <= 0) {
                            penguins.splice(p, 1);
                        }
                    }
                }
            }

            for (let i = rewards.length - 1; i >= 0; i--) {
                const reward = rewards[i];
                reward.timer += deltaTime;
                
                if (reward.timer >= reward.maxTime) {
                    rewards.splice(i, 1);
                    continue;
                }
                
                if (checkCollision(
                    {x: player.x, y: player.y, width: player.width, height: player.height},
                    {x: reward.x, y: reward.y, width: reward.size, height: reward.size}
                )) {
                    reward.effect();
                    rewards.splice(i, 1);
                }
            }
        }

        // 6. 渲染函数
        function render() {
            if (!gameState.isStarted) return;
            
            ctx.clearRect(0, 0, canvasWidth, canvasHeight);

            drawCatCharacter();
            
            if (penguins.length > 0) {
                penguins.forEach(penguin => {
                    drawPenguin(penguin);
                });
            }

            if (bullets.length > 0) {
                bullets.forEach(bullet => {
                    if (bullet.trail.length > 0) {
                        for (let t = 0; t < bullet.trail.length; t++) {
                            const alpha = t / bullet.trail.length;
                            ctx.fillStyle = `rgba(${bullet.color === '#4169E1' ? '65,105,225' : '255,255,255'},${alpha * 0.5})`;
                            ctx.beginPath();
                            ctx.arc(bullet.trail[t].x, bullet.trail[t].y, bulletSize * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.fillStyle = bullet.color;
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bulletSize, 0, Math.PI * 2);
                    ctx.fill();
                });
            }
            
            if (bossBullets.length > 0) {
                bossBullets.forEach(bullet => {
                    if (bullet.trail.length > 0) {
                        for (let t = 0; t < bullet.trail.length; t++) {
                            const alpha = t / bullet.trail.length;
                            ctx.fillStyle = `rgba(204,0,0,${alpha * 0.5})`;
                            ctx.beginPath();
                            ctx.arc(bullet.trail[t].x, bullet.trail[t].y, bossBulletSize * 0.5, 0, Math.PI * 2);
                            ctx.fill();
                        }
                    }
                    ctx.fillStyle = bullet.color;
                    ctx.beginPath();
                    ctx.arc(bullet.x, bullet.y, bossBulletSize, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            if (enemies.length > 0) {
                const enemyHpBase = baseEnemyHp + gameState.bossKillCount * 1.0;
                enemies.forEach(enemy => {
                    const size = enemy.slimeSize || enemySize;
                    const centerX = enemy.x + size/2;
                    const centerY = enemy.y + size/2;
                    
                    // 史莱姆特殊渲染
                    if (enemy.type === 'slime') {
                        // 绘制史莱姆身体
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, size/2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 史莱姆眼睛
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(centerX - size/5, centerY - size/5, size/8, 0, Math.PI * 2);
                        ctx.arc(centerX + size/5, centerY - size/5, size/8, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 史莱姆瞳孔
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(centerX - size/5, centerY - size/5, size/12, 0, Math.PI * 2);
                        ctx.arc(centerX + size/5, centerY - size/5, size/12, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 史莱姆嘴巴
                        ctx.strokeStyle = '#ff69b4';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY + size/8, size/6, 0, Math.PI);
                        ctx.stroke();
                        
                        // 史莱姆果冻质感高光
                        ctx.fillStyle = 'rgba(255,255,255,0.3)';
                        ctx.beginPath();
                        ctx.ellipse(centerX - size/8, centerY - size/8, size/8, size/12, -0.5, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        // 绘制敌人身体（圆形）
                        ctx.fillStyle = enemy.color;
                        ctx.beginPath();
                        ctx.arc(centerX, centerY, size/2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制敌人眼睛
                        ctx.fillStyle = '#fff';
                        ctx.beginPath();
                        ctx.arc(enemy.x + size/4, enemy.y + size/3, 4, 0, Math.PI * 2);
                        ctx.arc(enemy.x + size*3/4, enemy.y + size/3, 4, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制敌人瞳孔
                        ctx.fillStyle = '#000';
                        ctx.beginPath();
                        ctx.arc(enemy.x + size/4, enemy.y + size/3, 2, 0, Math.PI * 2);
                        ctx.arc(enemy.x + size*3/4, enemy.y + size/3, 2, 0, Math.PI * 2);
                        ctx.fill();
                        
                        // 绘制敌人嘴巴
                        ctx.strokeStyle = '#000';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.arc(centerX, enemy.y + size*2/3, 5, 0, Math.PI);
                        ctx.stroke();
                        
                        // 绘制敌人触角
                        ctx.strokeStyle = enemy.color;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(enemy.x + size/4, enemy.y);
                        ctx.lineTo(enemy.x, enemy.y - 10);
                        ctx.moveTo(enemy.x + size*3/4, enemy.y);
                        ctx.lineTo(enemy.x + size, enemy.y - 10);
                        ctx.stroke();
                        
                        // 奶怪显示治疗图标
                        if (enemy.type === 'healer') {
                            ctx.fillStyle = '#fff';
                            ctx.font = 'bold 14px Arial';
                            ctx.textAlign = 'center';
                            ctx.fillText('💚', centerX, centerY + 5);
                        }
                    }
                    
                    // 绘制血条
                    if (enemy.hp > 1 || enemy.defense > 0) {
                        ctx.fillStyle = '#ff0000';
                        ctx.fillRect(enemy.x, enemy.y - 5, size, 3);
                        ctx.fillStyle = '#00ff00';
                        ctx.fillRect(enemy.x, enemy.y - 5, size * (enemy.hp / Math.max(enemy.hp, enemy.maxHp || enemyHpBase)), 3);
                    }
                    
                    // 史莱姆显示类型
                    if (enemy.type === 'slime') {
                        ctx.fillStyle = '#fff';
                        ctx.font = 'bold 10px Arial';
                        ctx.textAlign = 'center';
                        let slimeLabel = '';
                        if (enemy.slimeType === 'large') slimeLabel = '大';
                        else if (enemy.slimeType === 'medium') slimeLabel = '中';
                        else if (enemy.slimeType === 'small') slimeLabel = '小';
                        ctx.fillText(slimeLabel, centerX, enemy.y - 8);
                    }
                });
            }
            
            if (boss.isAlive) {
                drawBoss();
            }

            if (rewards.length > 0) {
                rewards.forEach(reward => {
                    const scale = 1 + Math.sin(reward.timer / 500) * 0.1;
                    ctx.save();
                    ctx.translate(reward.x + reward.size/2, reward.y + reward.size/2);
                    ctx.scale(scale, scale);
                    ctx.fillStyle = reward.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, reward.size/2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.font = '12px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(reward.type === 'hp' ? '+' : reward.type === 'speed' ? '⚡' : '🔫', 0, 0);
                    ctx.restore();
                });
            }

            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText(`分数：${Math.floor(score)}`, 20, 30);
            ctx.fillText(`血量：${Math.floor(player.hp)}/${player.maxHp + player.maxHpBonus}`, 20, 60);
            ctx.fillText(`消灭：${enemiesKilled}`, 20, 90);
            // 波数显示
            const isBossWave = gameState.bossWaves.includes(gameState.currentWave);
            if (isBossWave) {
                ctx.fillStyle = '#ff0000';
                ctx.fillText(`第 ${gameState.currentWave}/${gameState.maxWaves} 波 | BOSS战！`, 20, 120);
            } else {
                ctx.fillText(`第 ${gameState.currentWave}/${gameState.maxWaves} 波 | ${gameState.waveTimeRemaining}秒`, 20, 120);
            }
            ctx.fillText(`敌人强度：${(1 + gameState.bossKillCount * 1.0).toFixed(1)}x`, 20, 150);
            ctx.fillText(`强化等级：${gameState.upgradeLevel}`, 20, 180);
            ctx.fillText(`企鹅：${penguins.length}/5`, 20, 210);
            
            // BOSS倒计时
            if (gameState.bossKillCount === 0) {
                if (enemiesKilled < 30 && !gameState.bossSpawned) {
                    ctx.fillStyle = '#ff9900';
                    ctx.fillText(`距离BOSS出现：${30 - enemiesKilled}`, canvasWidth - 200, 30);
                }
            } else {
                if (!gameState.bossSpawned) {
                    ctx.fillStyle = '#ff9900';
                    ctx.fillText(`下次BOSS：${100 - gameState.enemiesSinceBossDefeated}`, canvasWidth - 200, 30);
                }
            }
            
            if (player.speed > player.baseSpeed * player.speedMultiplier) {
                ctx.fillStyle = '#2196F3';
                ctx.fillText('移速提升！', canvasWidth - 120, 60);
            }
            if (player.shootRate < player.baseShootRate * player.shootRateMultiplier) {
                ctx.fillStyle = '#FF9800';
                ctx.fillText('射速提升！', canvasWidth - 120, 90);
            }
            
            if (boss.isAlive) {
                ctx.fillStyle = '#ff0000';
                ctx.font = '24px Arial';
                ctx.fillText(`BOSS血量：${boss.hp}/${boss.maxHp}`, canvasWidth - 200, 120);
            }
            
            ctx.fillStyle = '#ffb7b2';
            ctx.font = '16px Arial';
            ctx.fillText(`移速：${(player.speedMultiplier * 100).toFixed(0)}%`, canvasWidth - 200, 150);
            ctx.fillText(`射速：${(player.shootRateMultiplier * 100).toFixed(0)}%`, canvasWidth - 200, 175);
            ctx.fillText(`防御：${(player.defenseMultiplier * 100).toFixed(0)}%`, canvasWidth - 200, 200);
            ctx.fillText(`子弹数：${player.bulletCount}`, canvasWidth - 200, 225);
            ctx.fillText(`分裂：${player.bulletSplit}次`, canvasWidth - 200, 250);
            ctx.fillText(`伤害：${player.bulletDamage}`, canvasWidth - 200, 275);
            ctx.fillText(`回血：5%/秒`, canvasWidth - 200, 300);
            
            if (player.hasSpecialSkill) {
                ctx.fillStyle = '#FFD700';
                ctx.fillText(`技能：咕咕嘎嘎 (Q)`, canvasWidth - 200, 330);
            }
            
            // 显示不死猫剩余复活次数
            if (player.isImmortal) {
                ctx.fillStyle = '#9c27b0';
                ctx.fillText(`剩余复活：${player.immortalReviveCount}次`, canvasWidth - 200, 360);
            }
            
            // 显示自动射击状态
            if (player.autoShoot) {
                ctx.fillStyle = '#4CAF50';
                ctx.fillText(`自动射击：开启 (C)`, canvasWidth - 200, player.isImmortal ? 390 : 360);
            } else {
                ctx.fillStyle = '#999';
                ctx.fillText(`自动射击：关闭 (C)`, canvasWidth - 200, player.isImmortal ? 390 : 360);
            }
            
            // 显示1.25倍速状态
            if (gameState.speedBoostActive) {
                ctx.fillStyle = '#FFD700';
                ctx.fillText(`1.25倍速：开启 (L)`, canvasWidth - 200, player.isImmortal ? 420 : 390);
            } else {
                ctx.fillStyle = '#999';
                ctx.fillText(`1.25倍速：关闭 (L)`, canvasWidth - 200, player.isImmortal ? 420 : 390);
            }
        }

        // 7. 游戏循环
        let gameLoopId;
        function gameLoop(timestamp) {
            let deltaTime = timestamp - lastTime;
            
            // 1.25倍速功能
            if (gameState.speedBoostActive) {
                deltaTime *= 1.25;
            }
            
            if (deltaTime >= frameInterval) {
                update(deltaTime);
                render();
                lastTime = timestamp - (deltaTime % frameInterval);
            }
            gameLoopId = requestAnimationFrame(gameLoop);
        }

        startScreen.style.display = 'flex';
        updateUpgradeProgressUI();
        skillCooldown.style.display = 'none';
        
        // 游戏结束处理
        function showGameOver() {
            gameState.isStarted = false;
            gameState.isGameOver = true;
            
            // 计算生存时间
            const survivalTime = Math.floor((Date.now() - gameStartTime) / 1000);
            
            // 更新游戏结束界面的统计信息
            document.getElementById('finalScore').textContent = Math.floor(score);
            document.getElementById('finalEnemiesKilled').textContent = enemiesKilled;
            document.getElementById('finalBossKills').textContent = gameState.bossKillCount;
            document.getElementById('finalUpgradeLevel').textContent = gameState.upgradeLevel;
            document.getElementById('finalSurvivalTime').textContent = `${survivalTime}秒`;
            
            // 显示游戏结束界面
            document.getElementById('gameOverScreen').style.display = 'flex';
        }
        
        // 游戏结束界面事件监听器
        document.getElementById('gameOverRestartBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').style.display = 'none';
            // 重置游戏
            gameState.isStarted = true;
            gameState.isPaused = false;
            gameState.isGameOver = false;
            gameState.bossSpawned = false;
            gameState.bossDefeated = false;
            gameState.canUpgrade = false;
            gameState.canAdvancedUpgrade = false;
            gameState.upgradeLevel = 0;
            gameState.upgradeRequired = 5;
            gameState.upgradeProgress = 0;
            gameState.enemiesSinceBossDefeated = 0;
            gameState.bossKillCount = 0;
            // 重置游戏对象
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = 100;
            player.maxHp = 100;
            player.speed = 5;
            player.speedMultiplier = 1.0;
            player.shootRateMultiplier = 1.0;
            player.maxHpBonus = 0;
            player.defenseMultiplier = 1.0;
            player.bulletCount = 1;
            player.bulletSplit = 0;
            player.bulletDamage = 1;
            player.hpRegen = 0;
            player.hasSpecialSkill = false;
            player.keys = { w: false, a: false, s: false, d: false, q: false };
            player.shootRate = 200;
            player.lastShootTime = 0;
            // 西部猫咪相关属性
            player.hasCowboyPassive = false;
            player.bulletsShot = 0;
            player.isReloading = false;
            player.reloadEndTime = 0;
            player.hasCowboySkill = false;
            player.ridingEnemy = null;
            player.ridingEndTime = 0;
            // 清空数组
            bullets.length = 0;
            bossBullets.length = 0;
            enemies.length = 0;
            penguins.length = 0;
            rewards.length = 0;
            // 重置BOSS
            boss.isAlive = false;
            boss.hp = 100;
            boss.maxHp = 100;
            boss.speed = 1.5;
            boss.attackInterval = 2000;
            // 重置分数和计数器
            score = 0;
            enemiesKilled = 0;
            // 重置游戏循环
            lastTime = 0;
            // 开始新游戏
            gameStartTime = Date.now();
            startScreen.style.display = 'none';
            pauseToggle.style.display = 'block';
            skillCooldown.style.display = 'flex';
            // 清除之前的游戏循环
            cancelAnimationFrame(gameLoopId);
            // 启动新的游戏循环
            gameLoopId = requestAnimationFrame(gameLoop);
        });
        
        document.getElementById('gameOverMenuBtn').addEventListener('click', () => {
            document.getElementById('gameOverScreen').style.display = 'none';
            startScreen.style.display = 'flex';
        });
        
        // 重置游戏
        function resetGame() {
            // 重置游戏状态
            gameState = {
                isStarted: false,
                isPaused: false,
                bossSpawned: false,
                bossDefeated: false,
                canUpgrade: false,
                canAdvancedUpgrade: false,
                upgradeLevel: 0,
                upgradeRequired: 5,
                upgradeProgress: 0,
                enemiesSinceBossDefeated: 0,
                bossKillCount: 0,
                isGameOver: false,
                selectedChar: 'normal',
                immortalReviveCount: 8,
                immortalReviveBonus: 0
            };
            
            // 重置游戏对象
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.hp = 100;
            player.maxHp = 100;
            player.speed = 5;
            player.speedMultiplier = 1.0;
            player.shootRateMultiplier = 1.0;
            player.maxHpBonus = 0;
            player.defenseMultiplier = 1.0;
            player.bulletCount = 1;
            player.bulletSplit = 0;
            player.bulletDamage = 1;
            player.hpRegen = 0;
            player.hasSpecialSkill = false;
            player.keys = { w: false, a: false, s: false, d: false, q: false };
            player.shootRate = 200;
            player.lastShootTime = 0;
            // 西部猫咪相关属性
            player.hasCowboyPassive = false;
            player.bulletsShot = 0;
            player.isReloading = false;
            player.reloadEndTime = 0;
            player.hasCowboySkill = false;
            player.ridingEnemy = null;
            player.ridingEndTime = 0;
            
            // 清空数组
            bullets.length = 0;
            bossBullets.length = 0;
            enemies.length = 0;
            penguins.length = 0;
            rewards.length = 0;
            
            // 重置BOSS
            boss.isAlive = false;
            boss.hp = 100;
            boss.maxHp = 100;
            boss.speed = 1.5;
            boss.attackInterval = 2000;
            
            // 重置分数和计数器
            score = 0;
            enemiesKilled = 0;
            
            // 重置游戏开始时间
            gameStartTime = 0;
        }
        
        // 修改玩家生命值为0时的处理逻辑
        function checkPlayerDeath() {
            if (player.hp <= 0) {
                showGameOver();
            }
        }
        
        // 在update函数中添加玩家死亡检查
        const originalUpdate = update;
        update = function(deltaTime) {
            originalUpdate(deltaTime);
            checkPlayerDeath();
        };
    </script>
</body>
</html>
