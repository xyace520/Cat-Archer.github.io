<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>猫咪射手 - 二次元射击游戏</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; overflow: hidden; font-family: "Microsoft Yahei", sans-serif; }
        canvas { 
            display: block; 
            margin: 0 auto; 
            background: #0f3460;
            max-width: 100vw;
            max-height: 100vh;
        }
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 20px;
            width: 100%;
            justify-content: space-between;
            padding: 0 20px;
        }
        .joystick {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(255,255,255,0.2);
        }
        .shoot-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #e94560;
            border: none;
            color: #fff;
            font-size: 16px;
        }
        @media (max-width: 768px) {
            .mobile-controls { display: flex; }
        }

        /* 开始界面样式 */
        .start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }
        .start-title {
            font-size: 48px;
            margin-bottom: 20px;
            color: #ff9aa2;
            text-shadow: 0 0 10px rgba(255,154,162,0.8);
        }
        .start-subtitle {
            font-size: 20px;
            margin-bottom: 40px;
            color: #ffb7b2;
        }
        .start-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: linear-gradient(90deg, #ff9aa2, #ffb7b2);
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255,183,178,0.4);
        }
        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(255,183,178,0.6);
        }
        .difficulty-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }
        .difficulty-btn {
            padding: 15px 30px;
            font-size: 18px;
        }
        .start-controls {
            position: absolute;
            bottom: 30px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
        .selected-char-info {
            margin-bottom: 20px;
            padding: 15px 30px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            text-align: center;
        }
        .selected-char-name {
            font-size: 24px;
            font-weight: bold;
            color: #ff9aa2;
            margin-bottom: 10px;
        }

        /* 暂停界面样式 */
        .pause-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 90;
            color: #fff;
        }
        .pause-title {
            font-size: 48px;
            margin-bottom: 30px;
            color: #ff9aa2;
        }
        .pause-btns {
            display: flex;
            gap: 20px;
        }
        .pause-btn {
            padding: 10px 30px;
            font-size: 20px;
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .resume-btn {
            background: linear-gradient(90deg, #4CAF50, #2e7d32);
        }
        .restart-btn {
            background: linear-gradient(90deg, #FF9800, #e65100);
        }
        .pause-btn:hover {
            transform: scale(1.05);
        }

        /* 暂停按钮 */
        .pause-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255,255,255,0.2);
            border: 2px solid #fff;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            z-index: 80;
        }
        
        /* BOSS出现提示 */
        .boss-warning {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
            color: #ff0000;
            text-shadow: 0 0 20px #ff0000;
            display: none;
            z-index: 70;
            animation: flash 1s ease-in-out;
        }
        
        @keyframes flash {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* 强化选择界面 */
        .upgrade-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 500px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-radius: 20px;
            padding: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 85;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
        }
        .upgrade-title {
            font-size: 32px;
            color: #ff9aa2;
            margin-bottom: 20px;
            text-align: center;
        }
        .upgrade-desc {
            color: #ffb7b2;
            margin-bottom: 30px;
            font-size: 18px;
            text-align: center;
        }
        .upgrade-options {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }
        .upgrade-btn {
            padding: 15px 25px;
            background: linear-gradient(90deg, #4CAF50, #2e7d32);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 120px;
        }
        .upgrade-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }
        .upgrade-btn.speed {
            background: linear-gradient(90deg, #2196F3, #0d47a1);
        }
        .upgrade-btn.shoot {
            background: linear-gradient(90deg, #FF9800, #e65100);
        }
        .upgrade-btn.hp {
            background: linear-gradient(90deg, #f44336, #b71c1c);
        }
        .upgrade-btn.defense {
            background: linear-gradient(90deg, #9c27b0, #4a148c);
        }
        .upgrade-btn.bullet-count {
            background: linear-gradient(90deg, #607D8B, #263238);
        }
        .upgrade-btn.split {
            background: linear-gradient(90deg, #FF5722, #E64A19);
        }
        .upgrade-btn.damage {
            background: linear-gradient(90deg, #9C27B0, #7B1FA2);
        }
        .upgrade-btn.hp-regen {
            background: linear-gradient(90deg, #8BC34A, #689F38);
        }
        .upgrade-btn.special {
            background: linear-gradient(90deg, #FFD700, #FFA500);
        }
        .upgrade-progress {
            position: fixed;
            top: 80px;
            left: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px 15px;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            z-index: 75;
        }
        
        /* 技能冷却提示 */
        .skill-cooldown {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 50px;
            color: #fff;
            font-size: 18px;
            z-index: 80;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .skill-icon {
            font-size: 24px;
        }
        .cooldown-bar {
            width: 100px;
            height: 5px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }
        .cooldown-fill {
            height: 100%;
            background: #4CAF50;
            width: 100%;
            transition: width 0.1s linear;
        }
        
        /* 游戏结束界面 */
        .game-over-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-radius: 20px;
            padding: 30px;
            display: none;
            flex-direction: column;
            align-items: center;
            z-index: 95;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            min-width: 300px;
        }
        
        .game-over-title {
            font-size: 48px;
            margin-bottom: 30px;
            color: #ff5722;
        }
        
        .game-stats {
            margin-bottom: 30px;
            text-align: left;
        }
        
        .game-stats p {
            font-size: 18px;
            margin: 10px 0;
            color: #ffb7b2;
        }
        
        .game-stats span {
            color: #4CAF50;
            font-weight: bold;
        }
        
        .game-over-btns {
            display: flex;
            gap: 20px;
        }
        
        .game-over-btn {
            padding: 12px 30px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .game-over-btn:hover {
            transform: scale(1.05);
        }
        
        .game-over-btn.restart-btn {
            background: linear-gradient(90deg, #4CAF50, #2e7d32);
        }
        
        .game-over-btn.menu-btn {
            background: linear-gradient(90deg, #2196F3, #0d47a1);
        }
        
        /* 角色选择界面样式 */
        .char-select-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }
        .char-select-buttons {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .char-btn {
            padding: 20px 25px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border: 3px solid #4CAF50;
            border-radius: 20px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 180px;
        }
        .char-btn:hover {
            transform: scale(1.05);
            border-color: #ff9aa2;
            box-shadow: 0 0 20px rgba(255,154,162,0.5);
        }
        .char-btn.selected {
            border-color: #FFD700;
            box-shadow: 0 0 20px rgba(255,215,0,0.5);
        }
        .char-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .char-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #ff9aa2;
        }
        .char-stats {
            text-align: center;
            font-size: 14px;
        }
        .char-stats p {
            margin: 5px 0;
        }
        .passive {
            color: #FFD700 !important;
            font-size: 11px !important;
            margin-top: 8px !important;
        }
        .normal-cat {
            border-color: #ffb7b2;
        }
        .cactus-cat {
            border-color: #4CAF50;
        }
        .immortal-cat {
            border-color: #9c27b0;
        }
        .back-btn {
            background: linear-gradient(90deg, #607D8B, #263238);
        }
    </style>
</head>
<body>
    <!-- 开始界面 -->
    <div class="start-screen" id="startScreen">
        <h1 class="start-title">猫咪射手</h1>
        <p class="start-subtitle">可爱二次元猫咪射击游戏</p>
        <div class="selected-char-info" id="selectedCharInfo" style="display: none;">
            <div class="selected-char-name" id="selectedCharName">请选择角色</div>
            <div id="selectedCharStats"></div>
        </div>
        <button class="start-btn" id="charSelectBtn">选择角色</button>
        <div class="difficulty-buttons" id="difficultyButtons">
            <button class="start-btn difficulty-btn" id="startBtn1">难度1（简单）</button>
            <button class="start-btn difficulty-btn" id="startBtn2">难度2（困难）</button>
        </div>
        <div class="start-controls">
            <p>电脑端：WASD移动 | 鼠标左键射击 | ESC暂停 | Q键释放技能 | C键自动射击</p>
            <p>移动端：左侧摇杆移动 | 右侧按钮射击</p>
        </div>
    </div>
    
    <!-- 角色选择界面 -->
    <div class="char-select-screen" id="charSelectScreen">
        <h1 class="start-title">选择角色</h1>
        <div class="char-select-buttons">
            <button class="char-btn normal-cat" id="normalCatBtn">
                <div class="char-icon">🐱</div>
                <div class="char-name">普通猫</div>
                <div class="char-stats">
                    <p>❤️ 血量: 100</p>
                    <p>⚔️ 攻击力: 3</p>
                    <p>🛡️ 防御力: 3</p>
                </div>
            </button>
            <button class="char-btn cactus-cat" id="cactusCatBtn">
                <div class="char-icon">🌵</div>
                <div class="char-name">仙人掌猫</div>
                <div class="char-stats">
                    <p>❤️ 血量: 150</p>
                    <p>⚔️ 攻击力: 1</p>
                    <p>🛡️ 防御力: 6</p>
                    <p class="passive">被动：受击时对附近敌人造成1真实伤害</p>
                </div>
            </button>
            <button class="char-btn immortal-cat" id="immortalCatBtn">
                <div class="char-icon">✨</div>
                <div class="char-name">不死猫</div>
                <div class="char-stats">
                    <p>❤️ 血量: 80</p>
                    <p>⚔️ 攻击力: 1</p>
                    <p>🛡️ 防御力: 1</p>
                    <p>🏃 速度: 1x</p>
                    <p>🔫 攻速: 1.0x</p>
                    <p class="passive">被动：死亡后自动复活(8次)，每次复活属性提升</p>
                </div>
            </button>
            <button class="char-btn cowboy-cat" id="cowboyCatBtn">
                <div class="char-icon">🤠</div>
                <div class="char-name">西部猫咪</div>
                <div class="char-stats">
                    <p>❤️ 血量: 75</p>
                    <p>⚔️ 攻击力: 15</p>
                    <p>🛡️ 防御力: 1</p>
                    <p>🏃 速度: 1x</p>
                    <p>🔫 攻速: 0.8x</p>
                    <p class="passive">被动：每发射6发子弹后需装弹1秒</p>
                    <p class="active">主动：上猫(40秒CD) - 骑上小怪，移速+5持续10秒</p>
                </div>
            </button>
        </div>
        <button class="start-btn back-btn" id="charBackBtn">返回</button>
    </div>

    <!-- 暂停界面 -->
    <div class="pause-screen" id="pauseScreen">
        <h2 class="pause-title">游戏暂停</h2>
        <div class="pause-btns">
            <button class="pause-btn resume-btn" id="resumeBtn">继续游戏</button>
            <button class="pause-btn restart-btn" id="restartBtn">重新开始</button>
        </div>
    </div>
    
    <!-- BOSS出现提示 -->
    <div class="boss-warning" id="bossWarning">BOSS出现！</div>
    
    <!-- 强化选择界面 -->
    <div class="upgrade-screen" id="upgradeScreen">
        <h2 class="upgrade-title">获得永久强化！</h2>
        <p class="upgrade-desc" id="upgradeDesc">选择一项强化提升你的能力</p>
        <div class="upgrade-options" id="upgradeOptions">
            <!-- 动态生成强化按钮 -->
        </div>
    </div>
    
    <!-- 强化进度提示 -->
    <div class="upgrade-progress" id="upgradeProgress">下次强化：击败5个敌人 (0/5)</div>

    <!-- 暂停按钮 -->
    <button class="pause-toggle" id="pauseToggle">暂停</button>
    
    <!-- 技能冷却提示 -->
    <div class="skill-cooldown" id="skillCooldown">
        <span class="skill-icon">🐧</span>
        <span>咕咕嘎嘎 (Q)</span>
        <div class="cooldown-bar">
            <div class="cooldown-fill" id="cooldownFill"></div>
        </div>
        <span id="cooldownText">就绪</span>
    </div>

    <!-- 游戏结束界面 -->
    <div class="game-over-screen" id="gameOverScreen">
        <h2 class="game-over-title">游戏结束</h2>
        <div class="game-stats">
            <p>最终分数：<span id="finalScore">0</span></p>
            <p>消灭敌人：<span id="finalEnemiesKilled">0</span></p>
            <p>击败BOSS：<span id="finalBossKills">0</span></p>
            <p>强化等级：<span id="finalUpgradeLevel">0</span></p>
            <p>生存时间：<span id="finalSurvivalTime">0</span></p>
        </div>
        <div class="game-over-btns">
            <button class="game-over-btn restart-btn" id="gameOverRestartBtn">重新开始</button>
            <button class="game-over-btn menu-btn" id="gameOverMenuBtn">返回菜单</button>
        </div>
    </div>

    <canvas id="gameCanvas" width="1000" height="800"></canvas>
    <div class="mobile-controls">
        <div class="joystick" id="joystick"></div>
        <button class="shoot-btn" id="shootBtn">射击</button>
    </div>

    <script>
        // 游戏状态管理
        let gameState = {
            isStarted: false,
            isPaused: false,
            bossSpawned: false,
            bossDefeated: false,
            canUpgrade: false,
            canAdvancedUpgrade: false,
            upgradeLevel: 0,
            upgradeRequired: 5,
            upgradeProgress: 0,
            enemiesSinceBossDefeated: 0,
            bossKillCount: 0,
            isGameOver: false,
            difficulty: 1,
            currentWave: 1,
            waveTimeRemaining: 60,
            waveEnemiesSpawned: 0,
            maxWaves: 10,
            meatEnemyWave: 3,
            rushEnemyWave: 5,
            bossWave: 10,
            bossWaves: [5], // 邪恶BOSS出现波数
            currentBossType: null, // 当前BOSS类型
            speedBoostActive: false, // 1.25倍速激活状态
            waveStartTime: 0,
            selectedChar: 'normal',
            immortalReviveCount: 8,
            immortalReviveBonus: 0
        };

        // DOM元素
        const startScreen = document.getElementById('startScreen');
        const pauseScreen = document.getElementById('pauseScreen');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const charSelectScreen = document.getElementById('charSelectScreen');
        const charSelectBtn = document.getElementById('charSelectBtn');
        const charBackBtn = document.getElementById('charBackBtn');
        const normalCatBtn = document.getElementById('normalCatBtn');
        const cactusCatBtn = document.getElementById('cactusCatBtn');
        const immortalCatBtn = document.getElementById('immortalCatBtn');
        const cowboyCatBtn = document.getElementById('cowboyCatBtn');
        const selectedCharInfo = document.getElementById('selectedCharInfo');
        const selectedCharName = document.getElementById('selectedCharName');
        const selectedCharStats = document.getElementById('selectedCharStats');
        const difficultyButtons = document.getElementById('difficultyButtons');
        const startBtn = document.getElementById('startBtn');
        const pauseToggle = document.getElementById('pauseToggle');
        const resumeBtn = document.getElementById('resumeBtn');
        const restartBtn = document.getElementById('restartBtn');
        const gameOverRestartBtn = document.getElementById('gameOverRestartBtn');
        const gameOverMenuBtn = document.getElementById('gameOverMenuBtn');
        const bossWarning = document.getElementById('bossWarning');
        const upgradeScreen = document.getElementById('upgradeScreen');
        const upgradeDesc = document.getElementById('upgradeDesc');
        const upgradeProgress = document.getElementById('upgradeProgress');
        const upgradeOptions = document.getElementById('upgradeOptions');
        const skillCooldown = document.getElementById('skillCooldown');
        const cooldownFill = document.getElementById('cooldownFill');
        const cooldownText = document.getElementById('cooldownText');
        const finalScore = document.getElementById('finalScore');
        const finalEnemiesKilled = document.getElementById('finalEnemiesKilled');
        const finalBossKills = document.getElementById('finalBossKills');
        const finalUpgradeLevel = document.getElementById('finalUpgradeLevel');
        const finalSurvivalTime = document.getElementById('finalSurvivalTime');

        // 1. 初始化Canvas和核心变量
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let lastTime = 0;
        const FPS = 60;
        const frameInterval = 1000 / FPS;
        let gameStartTime = 0;

        // 鼠标位置跟踪
        let mouseX = canvas.width / 2;
        let mouseY = 0;

        // 2. 游戏对象定义
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            width: 50,
            height: 50,
            baseSpeed: 5,
            speed: 5,
            hp: 100,
            maxHp: 100,
            speedMultiplier: 1.0,
            shootRateMultiplier: 1.0,
            maxHpBonus: 0,
            defenseMultiplier: 1.0,
            defense: 3, // 初始防御力
            bulletCount: 1,
            bulletSplit: 0,
            bulletDamage: 1,
            hpRegen: 0,
            lastRegenTime: 0,
            hasSpecialSkill: false,
            skillCooldown: 40,
            lastSkillUse: 0,
            bodyColor: '#ffb74d',
            earColor: '#e67c00',
            noseColor: '#ff8a65',
            eyeColor: '#ffffff',
            pawColor: '#ffffff',
            keys: { w: false, a: false, s: false, d: false, q: false, c: false },
            autoShoot: false,
            baseShootRate: 200,
            shootRate: 200,
            lastShootTime: 0,
            animationFrame: 0,
            blinkTimer: 0,
            tailWagTimer: 0,
            pawStepTimer: 0,
            isInvincible: false,
            invincibleEndTime: 0,
            hasCactusPassive: false,
            isImmortal: false,
            immortalReviveCount: 8,
            immortalReviveBonus: 0
        };

        const bullets = [];
        const bulletSpeed = 10;
        const bulletSize = 6;

        const bossBullets = [];
        const bossBulletSpeed = 8;
        const bossBulletSize = 8;

        const enemies = [];
        let baseEnemySpeed = 2;
        let baseEnemyHp = 1;
        const enemySize = 30;

        function generateRandomUpgrades() {
            upgradeOptions.innerHTML = '';

            if (gameState.canAdvancedUpgrade) {
                selectedUpgrades = [...advancedUpgrades];
            } else {
                const shuffledUpgrades = [...allUpgrades].sort(() => Math.random() - 0.5);
                selectedUpgrades = shuffledUpgrades.slice(0, 3);

                const btn = document.createElement('button');
                btn.className = `upgrade-btn ${upgrade.class}`;

        function checkUpgradeCondition() {

                gameState.canUpgrade = true;
                gameState.isPaused = true;
                
                if (gameState.canAdvancedUpgrade) {
                    upgradeDesc.textContent = `高级强化！BOSS专属奖励`;

        function applyUpgrade(upgrade) {

            alert(message);

        // 修复：子弹分裂BUG
        function splitBullet(x, y, angle, damage, splitCount) {
            if (splitCount <= 0) return;
            
            const angles = [angle - 0.2, angle + 0.2];
            angles.forEach(newAngle => {
                bullets.push({
                    x, y, 
                    angle: newAngle,
                    color: '#fff',
                    trail: [],
                    damage: damage * 0.7,
                    splitCount: splitCount - 1
                });
            });

        // 修复：直线发射2个子弹
        function shootBullet(x, y, angle) {
            let targetX, targetY, baseAngle;
            
            if (typeof angle === 'number') {
                baseAngle = angle;
            } else if (angle) {
                const rect = canvas.getBoundingClientRect();
                targetX = angle.clientX - rect.left;
                targetY = angle.clientY - rect.top;
                const dx = targetX - x;
                const dy = targetY - y;
                baseAngle = Math.atan2(dy, dx);
            } else {
                targetX = x + 200;
                targetY = y;
                const dx = targetX - x;
                const dy = targetY - y;
                baseAngle = Math.atan2(dy, dx);
            }
            
            // 直线发射，上下偏移
            const offset = 8;
            for (let i = 0; i < player.bulletCount; i++) {
                const angle = baseAngle + (i % 2 === 0 ? -offset/50 : offset/50);
                bullets.push({
                    x: x + (i % 2 === 0 ? -offset : offset),
                    y: y,
                    angle: angle,
                    color: '#fff',
                    trail: [],
                    damage: player.bulletDamage,
                    splitCount: player.bulletSplit
                });
            }
        }
        
        function bossShoot() {
            if (!boss.isAlive) return;
            
            const centerX = boss.x + boss.width/2;
            const centerY = boss.y + boss.height/2;
            const dx = player.x - centerX;
            const dy = player.y - centerY;
            const mainAngle = Math.atan2(dy, dx);
            
            for (let i = -1; i <= 1; i++) {
                const angle = mainAngle + (i * 0.2);
                bossBullets.push({
                    x: centerX,
                    y: centerY,
                    angle: angle,
                    color: '#cc0000',
                    trail: []
                });
            }
        }
        
        function penguinShoot(penguin) {
            if (enemies.length === 0) return;
            
            let nearestEnemy = enemies[0];
            let minDistance = Infinity;
            
            enemies.forEach(enemy => {
                const dx = enemy.x - penguin.x;
                const dy = enemy.y - penguin.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < minDistance) {
                    minDistance = distance;
                    nearestEnemy = enemy;
                }
            });
            
            const dx = nearestEnemy.x - penguin.x;
            const dy = nearestEnemy.y - penguin.y;
            const angle = Math.atan2(dy, dx);
            
            bullets.push({
                x: penguin.x + penguinSize/2, 
                y: penguin.y + penguinSize/2, 
                angle: angle,
                color: '#4169E1',
                trail: [],
                damage: 1,
                splitCount: 0
            });
        }
        
        function useSpecialSkill() {
            if (!gameState.isStarted || gameState.isPaused) return;
            
            const now = Date.now();
            
            // 西部猫咪主动技能：上猫
            if (player.hasCowboySkill) {
                const cooldownMs = 40 * 1000; // 40秒冷却
                
                if (now - player.lastSkillUse < cooldownMs) {
                    return;
                }
                
                // 寻找最近的小怪
                const sortedEnemies = [...enemies].sort((a, b) => {
                    const distA = Math.sqrt(Math.pow(a.x - player.x, 2) + Math.pow(a.y - player.y, 2));
                    const distB = Math.sqrt(Math.pow(b.x - player.x, 2) + Math.pow(b.y - player.y, 2));
                    return distA - distB;
                });
                
                // 找到第一个非奶怪的小怪
                const targetEnemy = sortedEnemies.find(e => e.type !== 'healer' && e.type !== 'slime');
                
                if (targetEnemy) {
                    // 骑上小怪，移除该敌人
                    const index = enemies.findIndex(e => e === targetEnemy);
                    if (index !== -1) {
                        enemies.splice(index, 1);
                    }
                    
                    // 设置骑乘状态
                    player.ridingEnemy = targetEnemy;
                    player.ridingEndTime = now + 10000; // 持续10秒
                    player.lastSkillUse = now;
                    
                    // 骑乘特效
                    ctx.fillStyle = 'rgba(255, 165, 0, 0.5)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    alert(`🐎 骑上小怪！移动速度+5，持续10秒！`);
                } else {
                    alert('附近没有可骑乘的小怪！');
                }
                
                return;
            }
            
            // 其他角色的技能
            if (!player.hasSpecialSkill) return;
            
            const cooldownMs = player.skillCooldown * 1000;
            
            if (now - player.lastSkillUse < cooldownMs) {
                return;
            }
            
            const sortedEnemies = [...enemies].sort((a, b) => {
                const distA = Math.sqrt(Math.pow(a.x - player.x, 2) + Math.pow(a.y - player.y, 2));
                const distB = Math.sqrt(Math.pow(b.x - player.x, 2) + Math.pow(b.y - player.y, 2));
                return distA - distB;
            });
            
            const selectedEnemies = sortedEnemies.slice(0, 5);
            
            selectedEnemies.forEach(enemy => {
                const index = enemies.findIndex(e => e === enemy);
                if (index !== -1) {
                    enemies.splice(index, 1);
                }
                
                penguins.push({
                    x: enemy.x,
                    y: enemy.y,
                    hp: penguinHp,
                    maxHp: penguinHp,
                    speed: penguinSpeed,
                    lastShootTime: 0,
                    target: null,
                    animationTimer: 0
                });
            });
            
            player.lastSkillUse = now;
            
            ctx.fillStyle = 'rgba(0, 191, 255, 0.5)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            alert(`咕咕嘎嘎！成功同化${selectedEnemies.length}个敌人为企鹅🐧`);
        }
        
        function updateSkillCooldownUI() {
            // 检查是否有特殊技能或西部猫咪技能
            if (!player.hasSpecialSkill && !player.hasCowboySkill) {
                skillCooldown.style.display = 'none';
                return;
            }
            
            skillCooldown.style.display = 'flex';
            const now = Date.now();
            
            // 根据角色类型设置冷却时间
            let cooldownMs;
            if (player.hasCowboySkill) {
                cooldownMs = 40 * 1000; // 西部猫咪40秒冷却
            } else {
                cooldownMs = player.skillCooldown * 1000;
            }
            
            const elapsed = now - player.lastSkillUse;
            
            if (elapsed >= cooldownMs) {
                cooldownFill.style.width = '100%';
                cooldownText.textContent = '就绪';
                cooldownText.style.color = '#4CAF50';
            } else {
                const remaining = cooldownMs - elapsed;
                const percent = remaining / cooldownMs;
                cooldownFill.style.width = `${(1 - percent) * 100}%`;
                cooldownText.textContent = `${Math.ceil(remaining / 1000)}s`;
                cooldownText.style.color = '#ff9800';
            }
        }

        // 处理玩家死亡
        function handlePlayerDeath() {
            if (player.isImmortal && player.immortalReviveCount > 0) {
                // 不死猫复活
                player.immortalReviveCount--;
                gameState.immortalReviveCount = player.immortalReviveCount;
                player.immortalReviveBonus++;
                gameState.immortalReviveBonus = player.immortalReviveBonus;
                
                // 清除强化
                player.bulletCount = 1;
                player.bulletSplit = 0;
                player.bulletDamage = 1 + player.immortalReviveBonus;
                player.hpRegen = 0;
                player.speedMultiplier = 1.0;
                player.shootRateMultiplier = 1.0;
                player.maxHpBonus = 0;
                player.hasSpecialSkill = false;
                
                // 属性提升：血量+30，其他属性+1
                const bonus = player.immortalReviveBonus;
                player.maxHp = 80 + bonus * 30;
                player.hp = player.maxHp;
                player.defense = 1 + bonus;
                player.speed = player.baseSpeed * player.speedMultiplier;
                player.shootRate = player.baseShootRate * player.shootRateMultiplier;
                
                // 给玩家1秒无敌帧
                player.isInvincible = true;
                player.invincibleEndTime = Date.now() + 1000;
                
                alert(`✨ 不死猫复活！剩余复活次数：${player.immortalReviveCount}\n属性提升：血量+30，攻击力+1，防御力+1`);

                alert(`游戏结束！分数：${Math.floor(score)}\n消灭敌人：${enemiesKilled}个\n强化等级：${gameState.upgradeLevel}`);

        // 动态调整游戏难度
        // 仙人掌猫被动技能：受击时对附近敌人造成1真实伤害
        function triggerCactusPassive() {
            if (!player.hasCactusPassive) return;
            
            const nearbyRange = 100; // 附近范围
            
            enemies.forEach(enemy => {
                const dx = enemy.x - player.x;
                const dy = enemy.y - player.y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance <= nearbyRange) {
                    enemy.hp -= 1; // 真实伤害，无视防御
                    
                    // 伤害特效
                    enemy.color = '#ff0000';
                    setTimeout(() => {
                        if (enemy) enemy.color = enemy.originalColor;
                    }, 100);
                    
                    // 检查是否击杀
                    if (enemy.hp <= 0) {
                        const index = enemies.indexOf(enemy);
                        if (index !== -1) {
                            enemies.splice(index, 1);
                            score += 10 * (1 + gameState.bossKillCount * 0.5);
                            enemiesKilled += 1;
                            checkUpgradeCondition();
                        }
                    }
                }
            });
        }

            if (side === 1) { x = canvasWidth + enemySize; y = Math.random() * canvasHeight; }

            if (side === 3) { x = Math.random() * canvasWidth; y = canvasHeight + enemySize; }

            // 根据游戏进度调整敌人强度

            let enemyHp = Math.floor(baseEnemyHp + (difficultyLevel * 0.5));
            
            // 根据类型调整属性
            let enemyColor, originalColor, enemyType = type;
            if (type === 'meat') {
                enemyHp *= 2; // 肉怪血量翻倍

            return rect1.x < rect2.x + rect2.width &&

                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;

        // 预计算常用值
        const canvasWidth = canvas.width;

        function drawPenguin(penguin) {
            const centerX = penguin.x + penguinSize/2;
            const centerY = penguin.y + penguinSize/2;
            
            penguin.animationTimer = (penguin.animationTimer + 0.1) % 10;
            
            ctx.fillStyle = '#000080';
            ctx.beginPath();
            ctx.arc(centerX, centerY, penguinSize/2 - 2, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.ellipse(centerX, centerY + 5, 12, 15, 0, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#000080';
            ctx.beginPath();
            ctx.arc(centerX, centerY - 10, 10, 0, Math.PI * 2);
            ctx.fill();
            
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(centerX - 4, centerY - 12, 2, 0, Math.PI * 2);
